{% extends "base.html" %}

{% block title %}Crea Profilo Medico - TeleDiabete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h3 class="mb-0 fw-bold"><i class="bi bi-person-plus me-2"></i>Registra Nuovo Medico</h3>
                <small class="text-white-50">Crea le credenziali per uno specialista diabetologo (FR2)</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.create_doctor') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label fw-semibold">Nome <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="first_name" name="first_name" required autofocus>
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label fw-semibold">Cognome <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="last_name" name="last_name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Indirizzo Email (Login) <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="es. dott.rossi@ospedale.it" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password Iniziale <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Minimo 4 caratteri" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
                            Annulla
                        </a>
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-check-circle me-1"></i>Crea Medico
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
